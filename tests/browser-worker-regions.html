<!doctype html><html lang="es"><meta charset="utf-8"><title>Trazado rápido de manos</title>
<style>body{background:#10101d;color:white;font:16px system-ui;margin:24px}canvas{width:560px;max-width:100%}button{padding:12px}pre{white-space:pre-wrap}</style>
<h1>Comprobación del trazado rápido de manos</h1><button id="run">Comprobar detector integrado</button><p id="status">Listo</p><canvas id="output" width="640" height="480"></canvas><pre id="metrics"></pre>
<script type="module">
import {createHandWorker} from './handTrackingWorker.js';
document.querySelector('#run').onclick=async()=>{
 const button=document.querySelector('#run'),status=document.querySelector('#status');button.disabled=true;let detector;
 try{
  const photo=new Image();photo.src='./real-hand-diagnostic.jpg';await photo.decode();const raw=document.createElement('canvas');raw.width=640;raw.height=480;raw.getContext('2d').drawImage(photo,340,182,316,238,0,0,640,480);
  status.textContent='Preparando una sola vez…';const start=performance.now();detector=await createHandWorker();const startupMs=performance.now()-start;
  const input=document.createElement('canvas');input.width=640;input.height=480;const c=input.getContext('2d'),output=document.querySelector('#output').getContext('2d'),metrics=[];
  const report=()=>document.querySelector('#metrics').textContent=JSON.stringify({startupMs,cases:metrics},null,2);
  for(const scenario of ['ambas','derecha sola','izquierda sola','vacío','ambas con cara','rostro sin manos']){
   status.textContent='Comprobando '+scenario;let value;const times=[],counts=[];
   let portrait;if(scenario==='rostro sin manos'){portrait=new Image();portrait.crossOrigin='anonymous';portrait.src='https://storage.googleapis.com/mediapipe-assets/portrait.jpg';await portrait.decode();}
   for(let frame=0;frame<8;frame++){
    c.fillStyle='#222';c.fillRect(0,0,640,480);
    if(scenario==='rostro sin manos')c.drawImage(portrait,0,0,portrait.naturalWidth,portrait.naturalHeight*.5,0,0,640,400);
    else if(scenario!=='vacío'){c.drawImage(raw,Math.sin(frame/3)*12,0);if(scenario==='derecha sola')c.fillRect(320,0,320,480);if(scenario==='izquierda sola')c.fillRect(0,0,320,480);}
    const t=performance.now();value=await detector.detect(input,t,scenario==='ambas con cara'?{x:.445,y:.485,width:.32,height:.58}:undefined);times.push(performance.now()-t);counts.push(value.multiHandLandmarks.length);
    if(scenario==='ambas'){output.drawImage(input,0,0);output.fillStyle='#4ECDC4';for(const hand of value.multiHandLandmarks)for(const p of hand)output.fillRect(p.x*640-3,p.y*480-3,6,6);}
   }
   metrics.push({scenario,counts,times,labels:value.multiHandedness.map(h=>h.label)});report();
  }status.textContent='Comprobación completada';
 }catch(e){status.textContent='Error: '+e.message}finally{detector?.close();button.disabled=false}
};
</script></html>
