<!doctype html><meta charset="utf-8"><title>Prueba local TensorFlow de manos</title>
<style>body{font:16px system-ui;background:#111827;color:white;margin:24px}canvas{width:480px}button{padding:12px}pre{white-space:pre-wrap}</style>
<h1>Prueba local del motor TensorFlow</h1><button id="run">Probar la muestra existente</button><p id="status">Listo</p><pre id="result"></pre>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/hand-pose-detection@2.0.1/dist/hand-pose-detection.min.js" crossorigin="anonymous"></script>
<script>
document.querySelector('#run').onclick=async()=>{
 const button=document.querySelector('#run'),status=document.querySelector('#status'),result=document.querySelector('#result');button.disabled=true;
 try{
  status.textContent='Preparando TensorFlow…';await tf.setBackend('webgl');await tf.ready();
  const photo=new Image();photo.src='./real-hand-diagnostic.jpg';await photo.decode();
  const raw=document.createElement('canvas');raw.width=640;raw.height=480;raw.getContext('2d').drawImage(photo,344,184.4375,320,240,0,0,640,480);
  const metrics=[];
  for(const modelType of ['full','lite']){
   status.textContent='Probando '+modelType+'…';
   const start=performance.now();const detector=await handPoseDetection.createDetector(handPoseDetection.SupportedModels.MediaPipeHands,{runtime:'tfjs',modelType,maxHands:2});
   const loadMs=performance.now()-start;
   try{
    for(const padding of [1,1.1,1.4]){
     const input=document.createElement('canvas');input.width=640;input.height=480;const c=input.getContext('2d');c.fillStyle='#222';c.fillRect(0,0,640,480);const inset=(padding-1)/(padding*2);c.drawImage(raw,640*inset,480*inset,640/padding,480/padding);
     let hands;const counts=[],times=[];
     for(let frame=0;frame<8;frame++){const now=performance.now();hands=await detector.estimateHands(input,{flipHorizontal:false});times.push(performance.now()-now);counts.push(hands.length);}
     metrics.push({modelType,padding,loadMs,counts,times,handedness:hands.map(h=>h.handedness),scores:hands.map(h=>h.score)});result.textContent=JSON.stringify(metrics,null,2);
     const label=document.createElement('p');label.textContent=modelType+' margen '+padding;document.body.append(label);
     const output=document.createElement('canvas');output.width=640;output.height=480;const oc=output.getContext('2d');oc.drawImage(raw,0,0);oc.strokeStyle=oc.fillStyle='#4ECDC4';
     for(const hand of hands){oc.beginPath();hand.keypoints.forEach((p,i)=>{const x=p.x*padding-(padding-1)*320,y=p.y*padding-(padding-1)*240;if(!i)oc.moveTo(x,y);else oc.lineTo(x,y);oc.fillRect(x-2,y-2,4,4)});oc.stroke();}document.body.append(output);
    }
   }finally{detector.dispose()}
  }
  status.textContent='Prueba completada';
 }catch(e){status.textContent='ERROR: '+e.message}
 finally{button.disabled=false}
};
</script>
